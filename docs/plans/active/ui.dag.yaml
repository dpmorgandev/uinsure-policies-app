    qa: docs/qa/ui-U9.md
    trace: docs/trace/ui/U9/
    acceptance:
      - "Replaces U6 (cut by David 2026-10-23: one Azure hosting story, not GitHub Pages): a hand-written infrastructure/modules/staticwebapp.bicep, wired into main.bicep beside the App Service"
      - "The Static Web App links the App Service as its backend, same origin, so the CSP stays default-src 'self'. The linked backend forwards /api unchanged and the API has no /api prefix: a documented gap in infrastructure/README.md, not fixed (David 2026-10-23, U9 review A1 R3: evidence only, never deployed)"
      - "The static build's settings and deep links on the host (routes fall back to index.html); trace.json is compiled before the build"
      - "bicep build and bicep build-params succeed for dev, test and prod; the pipeline gains a web build and deploy stage from the existing stage template; pipeline schema check passes"
      - "No secrets (deployment token from the resource, never in params); az never run; nothing deployed"
      - "Visual Studio (David 2026-10-23): the web app is a project in Uinsure.Policies.slnx (a JavaScript SDK .esproj in a web solution folder), and one launch profile starts the API and the web app together (multiple startup projects, the web app's dev server proxying /api to the API's port)"
      - "dotnet build Uinsure.Policies.slnx -warnaserror and dotnet test --solution stay as they are: the .esproj is excluded from the solution build, so pre-commit and pre-push never run npm"
