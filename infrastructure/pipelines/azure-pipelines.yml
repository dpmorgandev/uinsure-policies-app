# Evidence only: never connected to Azure DevOps, never run.
# build/test -> dev -> test -> prod, all three deployments from one stage template.
# Each environment is two stages: WhatIf_<env> (no environment, runs unapproved), then Deploy_<env>.
# Prod waits for the approval configured on the 'policies-prod' Azure DevOps environment only, after WhatIf_prod.
trigger:
  branches:
    include: [main]

pr: none

variables:
  - name: buildConfiguration
    value: Release
  - name: dotnetSdkVersion
    value: 10.0.x
  - name: nodeVersion
    value: 22.x

stages:
  - stage: Build
    displayName: Build and test
    jobs:
      - job: BuildTest
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: $(dotnetSdkVersion)

          - script: dotnet build Uinsure.Policies.slnx --configuration $(buildConfiguration) -warnaserror
            displayName: Build

          - script: dotnet test --solution Uinsure.Policies.slnx --configuration $(buildConfiguration)
            displayName: Test

          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/drop
              # Pinned to the Microsoft.EntityFrameworkCore.Design version in Directory.Packages.props.
              dotnet tool install --global dotnet-ef --version 10.0.13
              export PATH="$PATH:$HOME/.dotnet/tools"
              dotnet ef migrations script --idempotent \
                --project src/Uinsure.Policies.Persistence \
                --startup-project src/Uinsure.Policies.Api \
                --output $(Build.ArtifactStagingDirectory)/drop/migrations.sql
            displayName: Generate idempotent migration script

          - script: |
              dotnet publish src/Uinsure.Policies.Api --configuration $(buildConfiguration) \
                --output $(Build.ArtifactStagingDirectory)/publish
              mkdir -p $(Build.ArtifactStagingDirectory)/drop
              cd $(Build.ArtifactStagingDirectory)/publish
              zip -r $(Build.ArtifactStagingDirectory)/drop/app.zip .
              cp -r $(Build.SourcesDirectory)/infrastructure $(Build.ArtifactStagingDirectory)/drop/infrastructure
            displayName: Package app and infrastructure

          - publish: $(Build.ArtifactStagingDirectory)/drop
            artifact: drop
            displayName: Publish drop artifact

  # The web app (Docket) is built and tested here, before any deployment. Playwright runs against the real API,
  # started on the agent with its development SQLite database. The static host's settings are copied into the build.
  - stage: Web
    displayName: Web build and test
    dependsOn: Build
    jobs:
      - job: WebBuildTest
        pool:
          vmImage: ubuntu-latest
        steps:
          # The trace compiler reads git history, so the clone must be complete.
          - checkout: self
            fetchDepth: 0

          - task: UseNode@1
            displayName: Install Node
            inputs:
              version: $(nodeVersion)

          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: $(dotnetSdkVersion)

          - script: npm --prefix src/web ci
            displayName: Web install

          - script: npm --prefix src/web run typecheck
            displayName: Web typecheck

          - script: npm --prefix src/web run lint
            displayName: Web lint

          - script: npm --prefix src/web run lint:css
            displayName: Web CSS lint

          - script: npm --prefix src/web run test
            displayName: Web unit tests

          - script: npm --prefix src/web run trace
            displayName: Compile trace.json

          - script: npm --prefix src/web run build
            displayName: Web build

          - script: |
              npx --prefix src/web playwright install --with-deps chromium
              dotnet run --project src/Uinsure.Policies.Api --urls http://localhost:5080 &
              until curl --fail --silent http://localhost:5080/health/live; do sleep 2; done
              npm --prefix src/web run e2e
            displayName: Web end-to-end tests against the API

          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/web
              cp -r src/web/dist/. $(Build.ArtifactStagingDirectory)/web/
              cp infrastructure/web/staticwebapp.config.json $(Build.ArtifactStagingDirectory)/web/
            displayName: Package web build with the static host settings

          - publish: $(Build.ArtifactStagingDirectory)/web
            artifact: web
            displayName: Publish web artifact

  - template: stage-template.yml
    parameters:
      environmentName: dev
      azureServiceConnection: sc-policies-dev
      sqlServiceConnection: sc-policies-dev-sql
      dependsOn: Web

  - template: stage-template.yml
    parameters:
      environmentName: test
      azureServiceConnection: sc-policies-test
      sqlServiceConnection: sc-policies-test-sql
      dependsOn: Deploy_dev

  - template: stage-template.yml
    parameters:
      environmentName: prod
      azureServiceConnection: sc-policies-prod
      sqlServiceConnection: sc-policies-prod-sql
      dependsOn: Deploy_test
